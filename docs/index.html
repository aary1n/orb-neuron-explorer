<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orb neuron explorer</title>
<link rel="stylesheet" href="style.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23101418%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.6%22 fill=%22%237fd6ff%22/%3E%3C/svg%3E">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <span id="brand" class="mono">orb<span class="dim">·neurons</span></span>
  <select id="layer" aria-label="layer"></select>
  <span class="seg" id="layout-mode" title="how a sheet is laid out: by neuron index, or neurons with similar write weights side by side"><button data-k="index">index</button><button data-k="writes" class="on">writes</button></span>
  <span class="seg" id="colour-mode" title="what lights the dots"><button data-c="kurt" class="on">selective</button><button data-c="on">busy</button></span>
  <span class="seg" id="web-mode" title="connection web of the open neuron: who feeds it (upstream) and whom it feeds (downstream), read from the weights; yellow pushes up, magenta holds back"><button data-w="off">no web</button><button data-w="on" class="on">web</button></span><input id="web-z" value="6" inputmode="numeric" aria-label="links per side" title="links drawn per side">
  <input id="jump" placeholder="B2 L1 #12" aria-label="go to neuron" spellcheck="false" title="block, layer, neuron: B2 L1 #12, L2_h1 12, or 2/1/12">
  <span class="seg" id="q-mode"><button data-q="lens" class="on" title="search neuron labels, elements and crystals">lens</button><button data-q="fires" title="pick a crystal and see which neurons fire on its atoms">fires</button></span>
  <input id="q" placeholder="search labels: O, Cu, NaCl…" aria-label="search" spellcheck="false" autocomplete="off">
  <span id="status" class="mono"></span>
  <a id="about" href="#" title="what this is">?</a>
</header>

<main>
  <section id="map-view" class="view on">
    <canvas id="map"></canvas>
    <div id="layer-labels"></div>
    <button id="layer-back"></button>
  </section>

  <aside id="list" class="float">
    <div id="focus-head">
      <div class="id-line"><span id="f-id" class="mono"></span><span id="f-meta" class="mono dim"></span><button id="f-close" aria-label="close neuron">×</button></div>
      <textarea id="f-name" rows="1" placeholder="name" spellcheck="false" aria-label="neuron name"></textarea>
      <div id="f-cov" class="dim"></div>
    </div>
    <nav id="ltabs"><button data-lt="net" class="on">net</button><button data-lt="run">crystal</button><button id="list-hide" class="edge" aria-label="hide list">‹</button></nav>
    <div id="lt-net" class="lpane on">
      <div id="net"></div>
      <div id="list-head">
        <input id="filter" placeholder="filter this layer" spellcheck="false" aria-label="filter">
        <select id="sort" aria-label="sort">
          <option value="kurt">selective</option>
          <option value="max">strongest</option>
          <option value="on">busiest</option>
          <option value="eta2">element-bound</option>
          <option value="best">label match</option>
          <option value="n">index</option>
        </select>
      </div>
      <ol id="rows" class="rows"></ol>
    </div>
    <div id="lt-run" class="lpane">
      <div id="run-head">
        <input id="run-q" placeholder="crystal: formula or id" spellcheck="false" autocomplete="off" aria-label="crystal">
        <div id="run-hits" class="hits"></div>
      </div>
      <div id="run-info" class="dim"></div>
      <div id="run-filters">
        <span class="lab">layers</span><select id="run-layers"><option value="all">all</option><option value="L1">block 1</option><option value="L2">block 2</option><option value="L3">block 3</option><option value="L4">block 4</option><option value="L5">block 5</option><option value="L0">encoder</option></select>
        <span class="lab">z ≥</span><input id="run-min" value="3" inputmode="decimal" aria-label="minimum z">
      </div>
      <ol id="run-rows" class="rows"></ol>
    </div>
  </aside>

  <button id="list-tab" class="tab-edge left" aria-label="show list">›</button>
  <button id="focus-tab" class="tab-edge right mono" aria-label="open panel"></button>
  <aside id="focus" class="float">
    <nav id="tabs"><button data-tab="examples" class="on">Examples</button><button data-tab="crystal">Crystal</button><button data-tab="details">Details</button><button data-tab="claude">Claude</button><button id="f-collapse" class="edge" aria-label="collapse">›</button></nav>
    <div id="tab-examples" class="tab on"></div>
    <div id="tab-crystal" class="tab">
      <div id="xtal-bar">
        <span id="xtal-title" class="mono"></span>
        <span class="seg" id="xtal-cell"><button data-s="1" class="on">1×1×1</button><button data-s="2">2×2×2</button></span>
        <label class="dim"><input type="checkbox" id="xtal-shade" checked> shade by activation</label>
        <span id="xtal-scale" class="mono dim"></span>
      </div>
      <div id="xtal-wrap"><canvas id="xtal"></canvas><div id="xtal-tip" class="float"></div></div>
      <div id="xtal-atoms"></div>
    </div>
    <div id="tab-details" class="tab"></div>
    <div id="tab-claude" class="tab">
      <div id="a-thread"><div class="a-empty dim">Ask about the open neuron, or about any crystal. Claude answers with the explorer's own tools (neuron, search, crystal, fires, push) through the local server.</div></div>
      <div id="a-actions"></div>
      <form id="a-form"><textarea id="a-input" rows="1" placeholder="Ask Claude…" aria-label="Ask Claude" spellcheck="false"></textarea><button id="a-send" type="submit" aria-label="send">↑</button></form>
    </div>
  </aside>
  <div id="tip" class="float"></div>
  <div id="about-box" class="float">
    <button id="about-close" aria-label="close">×</button>
    <h2>Orb neuron explorer</h2>
    <div id="about-text"></div>
  </div>
</main>
<script type="module" src="app.js?v=1"></script>
</body>
</html>
